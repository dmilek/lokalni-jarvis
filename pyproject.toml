[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lokalni-jarvis"
version = "0.1.0"
description = "Local personal assistant with a web interface"
license = { file="LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask>=2.3,<4",
    "duckduckgo-search==6.3.7",
    "mcp>=1.0,<2; python_version >= '3.10'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
[project.scripts]
lokalni-jarvis-gui = "jarvis_gui:main"
lokalni-jarvis-mcp = "jarvis_mcp:main"

[tool.setuptools]
py-modules = ["assistant_core", "jarvis_gui", "jarvis_mcp"]
packages = ["jarvis_web"]

[tool.setuptools.package-data]
jarvis_web = ["static/*.css", "static/*.js", "templates/*.html"]